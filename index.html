<div class="nt-container">
    <!-- 导航栏 -->
    <div class="nt-tabs">
        <button class="nt-tab-btn active" data-tab="cleaner">🧹 清理维护</button>
        <button class="nt-tab-btn" data-tab="installer">📦 扩展导入</button>
        <button class="nt-tab-btn" data-tab="image">🖼️ 图片格式转换</button>
        <button class="nt-tab-btn" data-tab="preset">📋 Preset JSON 整理</button>
    </div>

    <!-- 模块 1：清理维护 -->
    <div class="nt-section" id="nt-sec-cleaner">
        <div class="nt-toolbar">
            <button class="nt-btn primary" id="nt-btn-scan-all">🔍 开始全面扫描</button>
            <div class="nt-btn-group">
                <span id="nt-total-clean-count">全部可清理项 (0)</span>
                <button class="nt-btn" id="nt-btn-global-select">全选</button>
                <button class="nt-btn" id="nt-btn-global-deselect">取消全选</button>
                <button class="nt-btn danger" id="nt-btn-batch-delete">一键清理已选</button>
            </div>
        </div>

        <div class="nt-form-group">
            <label class="nt-form-label">聊天记录过滤范围：</label>
            <select id="nt-chat-filter" class="text_pole">
                <option value="all">全部聊天记录</option>
                <option value="30" selected>超过 30 天未使用</option>
                <option value="90">超过 90 天未使用</option>
                <option value="180">超过 180 天未使用</option>
            </select>
        </div>

        <div id="nt-categories-wrapper" style="display: flex; flex-direction: column; gap: 8px;">
            <!-- 8 个分类容器由 JS 统一注入渲染 -->
        </div>
    </div>

    <!-- 模块 2：ZIP 扩展导入 -->
    <div class="nt-section" id="nt-sec-installer" style="display: none;">
        <div class="nt-file-drop" id="nt-zip-dropzone">
            <i class="fa-solid fa-file-zipper fa-2x" style="margin-bottom: 8px; color: #63b3ed;"></i>
            <div>点击选择或将扩展 ZIP 文件拖拽至此处</div>
            <input type="file" id="nt-zip-input" accept=".zip" style="display: none;" />
        </div>

        <div class="nt-form-group">
            <label class="nt-form-label">安装目标范围：</label>
            <select id="nt-ext-scope" class="text_pole">
                <option value="global" selected>所有用户 (data/extensions/third-party/)</option>
                <option value="local">仅为我 (data/default-user/extensions/)</option>
            </select>
        </div>

        <div class="nt-status-box" id="nt-ext-info" style="display: none;">
            <div><strong>识别扩展：</strong><span id="nt-ext-name">-</span></div>
            <div><strong>目录名：</strong><span id="nt-ext-folder">-</span></div>
            <div><strong>版本：</strong><span id="nt-ext-version">-</span></div>
            <div><strong>安装状态：</strong><span id="nt-ext-status">-</span></div>
        </div>

        <button class="nt-btn primary" id="nt-btn-install-ext" style="display: none;">执行安装 / 替换并自动刷新</button>
    </div>

    <!-- 模块 3：图片格式转换 -->
    <div class="nt-section" id="nt-sec-image" style="display: none;">
        <div class="nt-file-drop" id="nt-img-dropzone">
            <i class="fa-solid fa-image fa-2x" style="margin-bottom: 8px; color: #48bb78;"></i>
            <div>点击选择或拖放待转换图片</div>
            <input type="file" id="nt-img-input" accept="image/*" style="display: none;" />
        </div>

        <div class="nt-grid-2">
            <div class="nt-form-group">
                <label class="nt-form-label">输出格式：</label>
                <select id="nt-img-target-format" class="text_pole">
                    <option value="image/webp" selected>WebP (兼顾高压缩与清晰度)</option>
                    <option value="image/jpeg">JPEG / JPG</option>
                    <option value="image/png">PNG</option>
                </select>
            </div>
            <div class="nt-form-group">
                <label class="nt-form-label">尺寸限制 (最大长边)：</label>
                <select id="nt-img-resize" class="text_pole">
                    <option value="original" selected>保持原尺寸</option>
                    <option value="4096">最大边 4096 px</option>
                    <option value="2560">最大边 2560 px</option>
                    <option value="1920">最大边 1920 px (全高清)</option>
                    <option value="1280">最大边 1280 px (标清)</option>
                </select>
            </div>
        </div>

        <!-- JPEG / WebP 质量选项 -->
        <div class="nt-form-group" id="nt-quality-wrapper">
            <label class="nt-form-label">压缩质量: <span id="nt-quality-val">80</span>%</label>
            <input type="range" id="nt-img-quality" min="55" max="95" value="80" class="slider" />
        </div>

        <!-- PNG 色深压缩选项 -->
        <div class="nt-form-group" id="nt-png-opt-wrapper" style="display: none;">
            <label class="nt-form-label">PNG 优化策略：</label>
            <select id="nt-png-colors" class="text_pole">
                <option value="0" selected>原始 32-bit PNG (无损)</option>
                <option value="256">256 色调色板压缩</option>
                <option value="128">128 色量化压缩</option>
                <option value="64">64 色极致压缩</option>
            </select>
        </div>

        <div class="nt-status-box" id="nt-img-stats" style="display: none;">
            <div><strong>原始文件大小：</strong><span id="nt-img-orig-size">-</span></div>
            <div><strong>转换后大小：</strong><span id="nt-img-out-size">-</span></div>
            <div><strong>压缩减小率：</strong><span id="nt-img-ratio">-</span></div>
        </div>

        <div class="nt-btn-group">
            <button class="nt-btn primary" id="nt-btn-convert-img" disabled>开始转换</button>
            <button class="nt-btn" id="nt-btn-download-img" style="display: none;">导出图片</button>
        </div>
    </div>

    <!-- 模块 4：Preset JSON 整理器 -->
    <div class="nt-section" id="nt-sec-preset" style="display: none;">
        <div class="nt-file-drop" id="nt-preset-dropzone">
            <i class="fa-solid fa-file-code fa-2x" style="margin-bottom: 8px; color: #ed8936;"></i>
            <div>点击选择或拖放 Preset JSON 文件</div>
            <input type="file" id="nt-preset-input" accept=".json" style="display: none;" />
        </div>

        <div class="nt-status-box">
            <div><strong>整理规则说明：</strong></div>
            <div>✓ 读取 Preset 内置的 <code>prompt_order</code> 索引次序</div>
            <div>✓ 按 identifier 绝对顺序重构 <code>prompts</code> 数组对象排列</div>
            <div>✓ 100% 保持所有字段 (role, content, marker, injection 等) 原样不变</div>
            <div>✓ 自动输出 2-space 规范缩进 JSON 文件</div>
        </div>

        <div class="nt-status-box" id="nt-preset-result" style="display: none;">
            <div id="nt-preset-msg" style="color: #48bb78; font-weight: bold;"></div>
        </div>

        <div class="nt-btn-group">
            <button class="nt-btn primary" id="nt-btn-run-preset" disabled>开始整理</button>
            <button class="nt-btn" id="nt-btn-download-preset" style="display: none;">导出整理后的 JSON</button>
        </div>
    </div>
</div>
